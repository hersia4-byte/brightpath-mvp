# Render Blueprint — deploys all three ad MCP servers as always-on web services.
# https://render.com/docs/blueprint-spec
#
# How to use:
#   1. Push this repo to GitHub (already done on your branch).
#   2. In Render: New > Blueprint, pick this repo, and Render reads this file.
#   3. After deploy, set each service's credential env vars (marked sync:false)
#      in the Render dashboard.
#
# Auth: MCP_AUTH_TOKEN is intentionally left blank so the endpoint connects with
# Claude's basic "Add custom connector" flow. Leaving it blank means the URL is
# UNAUTHENTICATED — keep it private. Only set a value if your client can send an
# "Authorization: Bearer <value>" header.
#
# Each service's connector URL is:  https://<service>.onrender.com/mcp

services:
  - type: web
    name: tiktok-ads-mcp
    runtime: node
    rootDir: mcp-servers/tiktok-ads-mcp
    plan: free
    buildCommand: npm ci
    startCommand: npm run start:http
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Left blank so the endpoint connects out of the box with Claude's basic
      # "Add custom connector" flow (which doesn't send a custom auth header).
      # SECURITY: an unauthenticated endpoint lets anyone with the URL control
      # your ad spend. Keep the URL private. To lock it down, set a value here
      # AND use a client that can send "Authorization: Bearer <value>".
      - key: MCP_AUTH_TOKEN
        sync: false
      # For the one-click /auth Connect helper:
      - key: TIKTOK_APP_ID
        sync: false
      - key: TIKTOK_APP_SECRET
        sync: false
      # Filled automatically when you complete /auth (or set by hand):
      - key: TIKTOK_ACCESS_TOKEN
        sync: false
      - key: TIKTOK_ADVERTISER_ID
        sync: false

  - type: web
    name: google-ads-mcp
    runtime: node
    rootDir: mcp-servers/google-ads-mcp
    plan: free
    buildCommand: npm ci
    startCommand: npm run start:http
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Left blank so the endpoint connects out of the box with Claude's basic
      # "Add custom connector" flow (which doesn't send a custom auth header).
      # SECURITY: an unauthenticated endpoint lets anyone with the URL control
      # your ad spend. Keep the URL private. To lock it down, set a value here
      # AND use a client that can send "Authorization: Bearer <value>".
      - key: MCP_AUTH_TOKEN
        sync: false
      - key: GOOGLE_ADS_DEVELOPER_TOKEN
        sync: false
      - key: GOOGLE_ADS_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_ADS_CLIENT_ID
        sync: false
      - key: GOOGLE_ADS_CLIENT_SECRET
        sync: false
      - key: GOOGLE_ADS_LOGIN_CUSTOMER_ID
        sync: false
      - key: GOOGLE_ADS_CUSTOMER_ID
        sync: false

  - type: web
    name: pinterest-ads-mcp
    runtime: node
    rootDir: mcp-servers/pinterest-ads-mcp
    plan: free
    buildCommand: npm ci
    startCommand: npm run start:http
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Left blank so the endpoint connects out of the box with Claude's basic
      # "Add custom connector" flow (which doesn't send a custom auth header).
      # SECURITY: an unauthenticated endpoint lets anyone with the URL control
      # your ad spend. Keep the URL private. To lock it down, set a value here
      # AND use a client that can send "Authorization: Bearer <value>".
      - key: MCP_AUTH_TOKEN
        sync: false
      # For the one-click /auth Connect helper:
      - key: PINTEREST_APP_ID
        sync: false
      - key: PINTEREST_APP_SECRET
        sync: false
      # Filled automatically when you complete /auth (or set by hand):
      - key: PINTEREST_ACCESS_TOKEN
        sync: false
      - key: PINTEREST_AD_ACCOUNT_ID
        sync: false
